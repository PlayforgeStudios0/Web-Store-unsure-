<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLAYFORGE Hub - App & Game Store</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="nav-brand">
      <span class="brand-logo">⚡</span>
      <span class="brand-title">PLAYFORGE <small>HUB</small></span>
    </div>
    
    <div class="search-bar-container">
      <input type="text" id="searchInput" placeholder="Search games, apps, tags...">
      <button id="searchBtn">Search</button>
    </div>

    <nav class="nav-links">
      <a href="index.html" class="active">Store</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="admin.html" class="btn-admin">+ Publish App</a>
    </nav>
  </header>

  <main class="container">
    <section class="filter-section">
      <div class="category-tabs">
        <button class="tab-btn active" data-category="all">All Releases</button>
        <button class="tab-btn" data-category="games">Games</button>
        <button class="tab-btn" data-category="apps">Apps</button>
      </div>

      <div class="tag-filter-bar">
        <span class="filter-label">Filter by Tags:</span>
        <div class="tag-pills" id="tagPillsContainer">
          <!-- Dynamically populated tags -->
        </div>
      </div>
    </section>

    <section class="catalog-grid" id="catalogGrid">
      <div class="loading-state">Loading store catalog...</div>
    </section>
  </main>

  <!-- 18+ Age Verification Modal -->
  <div class="modal-overlay" id="ageModalOverlay">
    <div class="modal-card">
      <div class="modal-header warning">
        <h3>⚠️ Age Verification Required</h3>
      </div>
      <div class="modal-body">
        <p>This title is rated <span class="badge badge-18">18+</span> for mature content.</p>
        <p>Please confirm that you are at least 18 years of age to access and download this application.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="ageCancelBtn">Cancel</button>
        <button class="btn btn-danger" id="ageConfirmBtn">I am 18 or Older</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
